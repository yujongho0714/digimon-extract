name: digimon-sprites
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "분할 파일(001~003)을 올려둔 Release 태그"
        default: "src"
  release:
    types: [published]

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.release_tag || github.event.release.tag_name || 'src' }}
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow

      - name: 도구 파일 만들기 (이 파일 하나에 다 들어있음)
        run: |
          mkdir -p tools data
          cat > tools/export_idle.csx <<'ZZEOF_CSX'
          // UndertaleModCli 용 스크립트: d<ID>_idle 스프라이트의 모든 프레임을 PNG 로 내보냄
          using System;
          using System.IO;
          using System.Text.RegularExpressions;
          using UndertaleModLib.Util;

          string outDir = Environment.GetEnvironmentVariable("OUT_DIR") ?? Path.Combine(Path.GetDirectoryName(FilePath), "out");
          Directory.CreateDirectory(outDir);
          var re = new Regex(@"^d(\d+)_idle$");
          TextureWorker worker = new TextureWorker();
          int ok = 0, fail = 0;
          foreach (UndertaleSprite sprite in Data.Sprites)
          {
              if (sprite?.Name?.Content == null || !re.IsMatch(sprite.Name.Content)) continue;
              for (int i = 0; i < sprite.Textures.Count; i++)
              {
                  var tex = sprite.Textures[i]?.Texture;
                  if (tex == null) continue;
                  try
                  {
                      worker.ExportAsPNG(tex, Path.Combine(outDir, sprite.Name.Content + "_" + i + ".png"), null, true);
                      ok++;
                  }
                  catch (Exception e) { fail++; Console.WriteLine("실패 " + sprite.Name.Content + "_" + i + ": " + e.Message); }
              }
          }
          worker.Cleanup();
          Console.WriteLine("내보내기 완료: 성공 " + ok + " / 실패 " + fail);
          ZZEOF_CSX
          cat > tools/build_strips.py <<'ZZEOF_PY'
          # 사용법: python build_strips.py <내보낸프레임폴더> <출력폴더> [digimon_names.json]
          import json,os,re,sys,collections
          from PIL import Image
          src,out=sys.argv[1],sys.argv[2]
          names=json.load(open(sys.argv[3],encoding='utf8')) if len(sys.argv)>3 else {}
          os.makedirs(out,exist_ok=True);os.makedirs(os.path.join(out,'unnamed'),exist_ok=True)
          fr=collections.defaultdict(dict)
          for f in os.listdir(src):
              m=re.fullmatch(r'd(\d+)_idle_(\d+)\.png',f)
              if m: fr[int(m.group(1))][int(m.group(2))]=os.path.join(src,f)
          idx={}
          for i,d in sorted(fr.items()):
              ims=[Image.open(d[k]).convert('RGBA') for k in sorted(d)]
              W,H=ims[0].size
              nm=names.get(str(i));sub='' if nm else 'unnamed/'
              base=os.path.join(out,sub+'nd_%04d'%i)
              ims[0].save(base+'.png')
              st=Image.new('RGBA',(W*len(ims),H))
              for j,c in enumerate(ims): st.paste(c,(j*W,0))
              st.save(base+'_idle_strip.png')
              idx['nd_%04d'%i]={'id':i,'name':nm,'frames':len(ims),'w':W,'h':H}
          json.dump(idx,open(os.path.join(out,'index.json'),'w',encoding='utf8'),ensure_ascii=False,indent=1)
          print('완료',len(idx),'종 (이름 있음 %d, 이름 없음 %d)'%(sum(1 for v in idx.values() if v['name']),sum(1 for v in idx.values() if not v['name'])))
