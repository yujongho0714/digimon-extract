      - name: 분할 파일 받아서 이어붙이기 -> game.droid
        run: |
          set -e
          mkdir -p parts
          gh release download "$TAG" --dir parts --repo "$GITHUB_REPOSITORY"
          ls -la parts
          cat $(ls parts/* | sort) > apk.zip
          ls -la apk.zip
          unzip -Z1 apk.zip | grep -i "game.droid$" || { echo "game.droid 를 zip 안에서 못 찾음"; unzip -Z1 apk.zip | head -40; exit 1; }
          P=$(unzip -Z1 apk.zip | grep -i "game.droid$" | head -1)
          unzip -o -j apk.zip "$P" -d data
          rm -rf apk.zip parts
          ls -la data

      - name: UndertaleModTool CLI 준비
        run: |
          mkdir -p umt && cd umt
          gh release download --repo UnderminersTeam/UndertaleModTool --pattern '*CLI*Linux*' || true
          gh release download --repo UnderminersTeam/UndertaleModTool --pattern '*Linux*' || true
          for z in *.zip; do [ -f "$z" ] && unzip -o -q "$z" -d cli || true; done
          CLI=$(find cli -type f -iname 'UndertaleModCli' 2>/dev/null | head -1 || true)
          if [ -z "$CLI" ]; then
            echo "릴리스에서 못 찾음 -> 소스 빌드"
            git clone --depth 1 https://github.com/UnderminersTeam/UndertaleModTool src
            dotnet publish src/UndertaleModCli -c Release -o cli
            CLI=$(find cli -type f -iname 'UndertaleModCli' | head -1)
          fi
          chmod +x "$CLI"
          echo "CLI=$PWD/$CLI" >> "$GITHUB_ENV"
          echo "사용할 CLI: $PWD/$CLI"

      - name: d<ID>_idle 프레임 내보내기
        run: |
          mkdir -p out
          export OUT_DIR="$PWD/out"
          "$CLI" load data/game.droid --scripts tools/export_idle.csx 2>&1 | tee export.log
          echo "내보낸 PNG 수: $(ls out | wc -l)"
          [ "$(ls out | wc -l)" -gt 0 ] || { echo "내보낸 파일이 0개 -> 실패"; exit 1; }

      - name: 이름 붙이고 스트립 만들기
        run: python tools/build_strips.py out sprites data/digimon_names.json

      - uses: actions/upload-artifact@v4
        with:
          name: digimon_sprites
          path: sprites

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: export.log
          if-no-files-found: ignore
